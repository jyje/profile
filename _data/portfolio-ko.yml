          - <span class="resume-abstract-emoji no-print" aria-hidden="true">🐳</span> **GenAI 개발:** 클라우드 네이티브 환경의 **GenAI 워크로드**와 **AIOps 플랫폼**을 구현/운영할 수 있습니다.
          - <span class="resume-abstract-emoji no-print" aria-hidden="true">🤝</span> **팀 리딩:** 10인 내외 팀 프로젝트에서 **협업, 아키텍트 및 플랫폼 엔지니어링**을 리딩할 수 있습니다.
          - <span class="resume-abstract-emoji no-print" aria-hidden="true">🧑‍🔧</span> **아키텍트:** **고성능**, **고가용성**, **GPU 최적화**를 위한 **하이브리드 쿠버네티스 클러스터**를 개발/운영할 수 있습니다.
          - <span class="resume-abstract-emoji no-print" aria-hidden="true">🧑‍🎓</span> **기술지식:** **컴퓨터비전, 차량기술** 연구원 경험을 활용하여 **Agentic AI, ML, DevOps** 관련 의사 결정에 기여할 수 있습니다.
        
        저는 **차량기술** 및 **AI**를 포함한 다양한 분야의 도전을 꿈꾸고 있습니다. 제가 기여할 수 있는 팀이 있다면 편하게 연락 부탁드립니다.
        저의 이력서와 성과는 [**이력서**](https://jyje.online/ko/resume)를 참고해 주세요.

