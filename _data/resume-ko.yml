    resume-ko:
      title: 이력서
      abstract: >
        프로덕션을 위해 성능과 효율성을 모두 챙기는 현업 6년차 소프트웨어 엔지니어입니다. AI 플랫폼 개발을 위해 Agentic AI와 클라우드 역량을 발전시키고 있으며, 아래와 같은 전문성을 가지고 있습니다:

          - <span class="resume-abstract-emoji no-print" aria-hidden="true">🐳</span> **클라우드 AI 개발:** 프로덕션을 위한 **에이전트 하네스, 워크플로우**를 개발하고 **AIOps**를 도입해 배포/운영할 수 있습니다.
          - <span class="resume-abstract-emoji no-print" aria-hidden="true">🤝</span> **팀 빌딩:** 10인 내외 팀 프로젝트에서 **협업, 아키텍트 및 플랫폼 엔지니어링**을 기획/리딩할 수 있습니다.
          - <span class="resume-abstract-emoji no-print" aria-hidden="true">🧑‍🔧</span> **아키텍트:** **고성능**, **고가용성**, **GPU 최적화**를 위한 **하이브리드 쿠버네티스 클러스터**를 개발/운영할 수 있습니다.
          - <span class="resume-abstract-emoji no-print" aria-hidden="true">🧑‍🎓</span> **기술지식:** **컴퓨터비전, 차량기술** 연구원 경험을 활용하여 **Agentic AI, ML, DevOps** 관련 의사 결정에 기여할 수 있습니다.

        위 경험을 바탕으로 팀 초기 빌딩을 할 수 있고, 성숙한 팀에 빠르게 적응할 수 있습니다. 저는 **차량기술** 및 **AI**를 포함한 다양한 분야의 도전을 꿈꾸고 있습니다.
        자세한 경력은 [**포트폴리오**](https://jyje.online/ko/portfolio)를 참고해 주세요.

