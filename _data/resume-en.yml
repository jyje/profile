      abstract: >
        I am a software engineer with six years of industry experience, balancing performance and efficiency for production. I am developing my Agentic AI and cloud expertise to build AI platforms, with the following strengths:

          - <span class="resume-abstract-emoji no-print" aria-hidden="true">🐳</span> **Cloud AI Development:** I can develop **agent harnesses and workflows** for production and introduce **AIOps** to deploy and operate them.
          - <span class="resume-abstract-emoji no-print" aria-hidden="true">🤝</span> **Team Building:** I can plan and lead **collaboration, architecture, and platform engineering** in project teams of around ten.
          - <span class="resume-abstract-emoji no-print" aria-hidden="true">🧑‍🔧</span> **Architecture:** I can build and operate **hybrid Kubernetes clusters** for **high performance**, **high availability**, and **GPU optimization**.
          - <span class="resume-abstract-emoji no-print" aria-hidden="true">🧑‍🎓</span> **Technical Expertise:** Drawing on my research experience in **computer vision and automotive technology**, I can contribute to decisions involving **Agentic AI, ML, and DevOps**.

        With this experience, I can help build a team from the ground up and quickly adapt to a mature team. I seek challenges across diverse fields, including **automotive technology** and **AI**.
        See my [**portfolio**](https://jyje.online/en/portfolio) for details.

